name: RelayWorks deployment gate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment
        required: true
        type: choice
        options: [dev, production]

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  plan:
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
      - working-directory: infra/environments/dev
        run: terraform init -backend-config=backend.hcl
      - working-directory: infra/environments/dev
        run: terraform plan -out=relayworks.tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: infra/environments/dev/relayworks.tfplan
          retention-days: 7

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ format('{0}-approval', inputs.environment) }}
    steps:
      - run: echo "Apply is intentionally separated; promote the reviewed immutable plan from an approved release workflow."
